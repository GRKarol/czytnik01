name: Build starter library

# Wgrywa 6 tytulow domeny publicznej na jezyk (firmware/starter-books/*.rsvp)
# jako OSOBNE, nazwane assety Release'u (nie zip) — firmware pobiera je
# pojedynczo w tle na ekranie ladowania kreatora pierwszego uruchomienia
# (OtaUpdater::downloadAsset, patrz App::bookDownloadTask) po nazwie pliku,
# np. "starter-pl-1.rsvp".
#
# Pliki sa w repo, wygenerowane i sprawdzone lokalnie przez
# firmware/tools/generate_starter_library.py (Gutenberg, Wolne Lektury,
# Wikisource). CI ich nie pobiera od nowa: Gutenberg czesto zrywa polaczenia
# i release dostawalby wtedy niepelny zestaw.
#
# Triggerowany AUTOMATYCZNIE przez release.yml (workflow_call) po zbudowaniu
# bazowego firmware. Mozna tez uruchomic recznie podajac tag.

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag releasu, np. v0.3.50"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag releasu, np. v0.3.50"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-books:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Verify starter books
        run: |
          count=$(ls firmware/starter-books/*.rsvp | wc -l)
          echo "starter books: $count"
          test "$count" -eq 36

      - name: Upload starter books to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: firmware/starter-books/*.rsvp
