; plugins/rss/platformio.ini
[platformio]
boards_dir = ../../firmware/boards

[env:rss-plugin]
platform = espressif32@6.3.2
board = esp32-s3-r8-opi
framework = arduino
build_type = release
build_flags =
    -fPIC
    -fno-exceptions
    -fno-rtti
    -nostdlib
    -DPLUGIN_BUILD=1
build_unflags =
    -fno-PIC
extra_scripts =
    post:../../tools/pio_plugin_build.py
board_build.ldscript = ../../plugins/plugin.ld
lib_deps =
build_src_filter = +<src/>
lib_extra_dirs =
    ../../firmware/src/plugins/sdk
